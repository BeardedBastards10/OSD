name: Build firmware (Betaflight or ArduPilot)
run-name: "${{ inputs.firmware }} | ${{ inputs.fc_info != '' && 'version and board from pasted FC output' || format('{0} | board {1}', inputs.version || 'latest', inputs.board) }}"
on:
  workflow_dispatch:
    inputs:
      firmware:
        description: "STEP 1 - FIRMWARE: ArduPilot (adjustable VTX power + MGRS on OSD) or Betaflight (MGRS on OSD)"
        type: choice
        options:
          - ArduPilot
          - Betaflight
        default: ArduPilot
      fc_info:
        description: "STEP 2 - PASTE from your FC (optional, wins over steps 3 and 4): ArduPilot boot Messages, or Betaflight CLI diff all / version"
        required: false
        default: ""
      version:
        description: "STEP 3 - VERSION (skipped if you pasted): latest = newest stable. Or type one, e.g. Copter-4.7.2 / 2026.6.2"
        required: false
        default: latest
      board:
        description: "STEP 4 - BOARD (skipped if you pasted). Wrong name = stops in seconds and lists similar names"
        default: DAKEFPVH743

jobs:
  ardupilot:
    name: "ArduPilot: adjustable VTX power + MGRS on OSD"
    if: ${{ inputs.firmware == 'ArduPilot' }}
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and board (pasted FC output wins over the boxes)
        id: ver
        env:
          FIRMWARE: ArduPilot
          FC_INFO: ${{ inputs.fc_info }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BOARD: ${{ inputs.board }}
        run: |
          git config --global --add safe.directory '*'
          python3 mgrs_osd/resolve_fc.py

      - name: Get ArduPilot source
        run: git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules https://github.com/ArduPilot/ardupilot.git

      - name: Check the board exists in this version
        run: |
          if [ ! -f "ardupilot/libraries/AP_HAL_ChibiOS/hwdef/$BOARD/hwdef.dat" ]; then
            echo "ERROR: '$BOARD' is not an ArduPilot $TAG board. Names that look similar:"
            ls ardupilot/libraries/AP_HAL_ChibiOS/hwdef | grep -i "$(echo "$BOARD" | cut -c1-5)" || echo "(none)"
            exit 1
          fi
          echo "Board $BOARD found"

      - name: Add the adjustable VTX power script
        run: |
          mkdir -p ardupilot/ROMFS_custom/scripts
          cp vtx_power.lua ardupilot/ROMFS_custom/scripts/
          ls -l ardupilot/ROMFS_custom/scripts

      - name: Check MGRS converter against a reference library
        continue-on-error: true
        run: |
          pip3 install mgrs
          gcc -O2 -Wall -Wextra -Werror -o mgrs_osd/test_mgrs mgrs_osd/test_mgrs.c -lm
          python3 mgrs_osd/compare.py

      - name: Patch OSD so MGRS replaces latitude/longitude
        run: python3 mgrs_osd/apply_ardupilot.py ardupilot

      - name: Build
        working-directory: ardupilot
        run: |
          ./waf configure --board "$BOARD"
          ./waf copter

      - uses: actions/upload-artifact@v4
        with:
          name: ardupilot-${{ steps.ver.outputs.tag }}-${{ steps.ver.outputs.board }}-vtx-power-and-mgrs
          path: |
            ardupilot/build/${{ steps.ver.outputs.board }}/bin/arducopter.apj
            ardupilot/build/${{ steps.ver.outputs.board }}/bin/arducopter_with_bl.hex

  betaflight:
    name: "Betaflight: MGRS on OSD"
    if: ${{ inputs.firmware == 'Betaflight' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and board (pasted FC output wins over the boxes)
        id: ver
        env:
          FIRMWARE: Betaflight
          FC_INFO: ${{ inputs.fc_info }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BOARD: ${{ inputs.board }}
        run: python3 mgrs_osd/resolve_fc.py

      - name: Get Betaflight source
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/betaflight/betaflight.git bf
          git -C bf submodule update --init --depth 1 -- src/config

      - name: Check the board exists in this version
        run: |
          if [ -z "$(find bf/src/config/configs -type d -name "$BOARD" 2>/dev/null)" ]; then
            echo "ERROR: '$BOARD' is not a Betaflight $TAG config. Names that look similar:"
            find bf/src/config/configs -type d -iname "*$(echo "$BOARD" | cut -c1-5)*" 2>/dev/null | sed 's#.*/##' | sort -u | head -30
            exit 1
          fi
          echo "Board $BOARD found"

      - name: Check MGRS converter against a reference library
        continue-on-error: true
        run: |
          pip3 install mgrs
          gcc -O2 -Wall -Wextra -Werror -o mgrs_osd/test_mgrs mgrs_osd/test_mgrs.c -lm
          python3 mgrs_osd/compare.py

      - name: Patch OSD so MGRS replaces latitude/longitude
        run: python3 mgrs_osd/apply_betaflight.py bf

      - name: Install ARM toolchain
        working-directory: bf
        run: make arm_sdk_install

      - name: Build
        working-directory: bf
        run: |
          make configs
          make CONFIG="$BOARD"

      - uses: actions/upload-artifact@v4
        with:
          name: betaflight-${{ steps.ver.outputs.tag }}-${{ steps.ver.outputs.board }}-mgrs
          path: bf/obj/*.hex
