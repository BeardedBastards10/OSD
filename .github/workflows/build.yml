name: Build firmware (Betaflight or ArduPilot)
run-name: "${{ inputs.firmware }} ${{ inputs.version }} | board ${{ inputs.board }}"
on:
  workflow_dispatch:
    inputs:
      firmware:
        description: "STEP 1 - FIRMWARE: ArduPilot (Copter) or Betaflight"
        type: choice
        options:
          - ArduPilot
          - Betaflight
        default: ArduPilot
      version:
        description: "STEP 2 - VERSION: newest-stable, or an exact stable version (ArduPilot 4.7.3, Betaflight 2026.6.2)"
        default: newest-stable
      board:
        description: "STEP 3 - BOARD, must match your flight controller. Wrong name = stops in seconds and lists similar names"
        default: DAKEFPVH743
      mgrs:
        description: "STEP 4 - MGRS on OSD (patch the OSD so the latitude element shows MGRS)"
        type: boolean
        default: true
      vtx_script:
        description: "STEP 4 - ArduPilot only: include the adjustable VTX power script (vtx_power.lua)"
        type: boolean
        default: true
      bf_options:
        description: "STEP 4 - Betaflight only: build options (USE_ names, space separated). Empty = the saved baseline"
        default: ""

jobs:
  ardupilot:
    name: "ArduPilot Copter ${{ inputs.version }}"
    if: ${{ inputs.firmware == 'ArduPilot' }}
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:latest
    env:
      BOARD: ${{ inputs.board }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the ArduPilot version
        id: ver
        run: |
          git config --global --add safe.directory '*'
          echo "$BOARD" | grep -qE '^[A-Za-z0-9_-]+$' || { echo "ERROR: board name is empty or has odd characters: '$BOARD'"; exit 1; }
          if [ "$VERSION" = "newest-stable" ]; then
            V=$(git ls-remote --tags --refs https://github.com/ArduPilot/ardupilot 'refs/tags/Copter-*' | sed 's#.*refs/tags/##' | grep -E '^Copter-[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          else
            echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "ERROR: version must look like 4.7.3 or newest-stable, got '$VERSION'"; exit 1; }
            V="Copter-$VERSION"
            git ls-remote --exit-code --tags --refs https://github.com/ArduPilot/ardupilot "refs/tags/$V" >/dev/null || { echo "ERROR: tag $V does not exist"; exit 1; }
          fi
          [ -n "$V" ] || { echo "ERROR: could not work out the version"; exit 1; }
          echo "Using ArduPilot: $V"
          echo "TAG=$V" >> "$GITHUB_ENV"
          echo "tag=$V" >> "$GITHUB_OUTPUT"

      - name: Get ArduPilot source
        run: git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules https://github.com/ArduPilot/ardupilot.git

      - name: Check the board exists in this version
        run: |
          if [ ! -f "ardupilot/libraries/AP_HAL_ChibiOS/hwdef/$BOARD/hwdef.dat" ]; then
            echo "ERROR: '$BOARD' is not an ArduPilot $TAG board. Names that look similar:"
            ls ardupilot/libraries/AP_HAL_ChibiOS/hwdef | grep -i "$(echo "$BOARD" | cut -c1-5)" || echo "(none)"
            exit 1
          fi
          echo "Board $BOARD found"

      - name: Add the adjustable VTX power script
        if: ${{ inputs.vtx_script }}
        run: |
          mkdir -p ardupilot/ROMFS_custom/scripts
          cp vtx_power.lua ardupilot/ROMFS_custom/scripts/
          ls -l ardupilot/ROMFS_custom/scripts

      - name: Check MGRS converter against a reference library
        if: ${{ inputs.mgrs }}
        continue-on-error: true
        run: |
          pip3 install mgrs
          gcc -O2 -Wall -Wextra -Werror -o mgrs_osd/test_mgrs mgrs_osd/test_mgrs.c -lm
          python3 mgrs_osd/compare.py

      - name: Patch OSD so MGRS replaces latitude/longitude
        if: ${{ inputs.mgrs }}
        run: python3 mgrs_osd/apply_ardupilot.py ardupilot

      - name: Build
        working-directory: ardupilot
        run: |
          ./waf configure --board "$BOARD"
          ./waf copter

      - uses: actions/upload-artifact@v4
        with:
          name: ardupilot-${{ steps.ver.outputs.tag }}-${{ inputs.board }}${{ inputs.vtx_script && '-vtx-power' || '' }}${{ inputs.mgrs && '-mgrs' || '' }}
          path: |
            ardupilot/build/${{ inputs.board }}/bin/arducopter.apj
            ardupilot/build/${{ inputs.board }}/bin/arducopter_with_bl.hex

  betaflight:
    name: "Betaflight ${{ inputs.version }}"
    if: ${{ inputs.firmware == 'Betaflight' }}
    runs-on: ubuntu-22.04
    env:
      BOARD: ${{ inputs.board }}
      VERSION: ${{ inputs.version }}
      # Used when the bf_options input is empty: CRSF radio, automatic telemetry,
      # analog OSD, DSHOT, plus the "other options" ticked in the saved cloud build.
      BF_OPTIONS: >-
        ${{ inputs.bf_options != '' && inputs.bf_options || 'USE_SERIALRX_CRSF USE_TELEMETRY USE_TELEMETRY_CRSF USE_OSD_SD USE_DSHOT USE_ALTITUDE_HOLD USE_CAMERA_CONTROL USE_FLIGHT_PLAN USE_GPS USE_OPTICALFLOW USE_MAG USE_PINIO USE_POSITION_HOLD USE_RANGEFINDER USE_SERVOS USE_VTX' }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the Betaflight version
        id: ver
        run: |
          echo "$BOARD" | grep -qE '^[A-Za-z0-9_-]+$' || { echo "ERROR: board name is empty or has odd characters: '$BOARD'"; exit 1; }
          echo "$BF_OPTIONS" | grep -qE '^[A-Z0-9_ ]+$' || { echo "ERROR: build options may only hold USE_ names and spaces: '$BF_OPTIONS'"; exit 1; }
          if [ "$VERSION" = "newest-stable" ]; then
            V=$(git ls-remote --tags --refs https://github.com/betaflight/betaflight | sed 's#.*refs/tags/##' | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          else
            echo "$VERSION" | grep -qE '^[0-9]{4}\.[0-9]+\.[0-9]+$' || { echo "ERROR: version must look like 2026.6.2 or newest-stable, got '$VERSION'"; exit 1; }
            V="$VERSION"
            git ls-remote --exit-code --tags --refs https://github.com/betaflight/betaflight "refs/tags/$V" >/dev/null || { echo "ERROR: tag $V does not exist"; exit 1; }
          fi
          [ -n "$V" ] || { echo "ERROR: could not work out the version"; exit 1; }
          echo "Using Betaflight: $V"
          echo "Build options: $BF_OPTIONS"
          echo "TAG=$V" >> "$GITHUB_ENV"
          echo "tag=$V" >> "$GITHUB_OUTPUT"

      - name: Get Betaflight source
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/betaflight/betaflight.git bf
          git -C bf submodule update --init --depth 1 -- src/config

      - name: Check the board exists in this version
        run: |
          if [ -z "$(find bf/src/config/configs -type d -name "$BOARD" 2>/dev/null)" ]; then
            echo "ERROR: '$BOARD' is not a Betaflight $TAG config. Names that look similar:"
            find bf/src/config/configs -type d -iname "*$(echo "$BOARD" | cut -c1-5)*" 2>/dev/null | sed 's#.*/##' | sort -u | head -30
            exit 1
          fi
          echo "Board $BOARD found"

      - name: Check MGRS converter against a reference library
        if: ${{ inputs.mgrs }}
        continue-on-error: true
        run: |
          pip3 install mgrs
          gcc -O2 -Wall -Wextra -Werror -o mgrs_osd/test_mgrs mgrs_osd/test_mgrs.c -lm
          python3 mgrs_osd/compare.py

      - name: Patch OSD so MGRS replaces latitude/longitude
        if: ${{ inputs.mgrs }}
        run: python3 mgrs_osd/apply_betaflight.py bf

      - name: Install ARM toolchain
        working-directory: bf
        run: make arm_sdk_install

      - name: Build
        working-directory: bf
        run: |
          make configs
          make CONFIG="$BOARD" OPTIONS="$BF_OPTIONS" EXTRA_FLAGS="-DCLOUD_BUILD"

      - uses: actions/upload-artifact@v4
        with:
          name: betaflight-${{ steps.ver.outputs.tag }}-${{ inputs.board }}${{ inputs.mgrs && '-mgrs' || '' }}
          path: bf/obj/*.hex
