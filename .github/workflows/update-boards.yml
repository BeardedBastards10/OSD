name: Refresh ArduPilot board list
# The website cannot read the ArduPilot manifest from a browser (no CORS), so this
# copies the Copter board and version list into site/boards-ardupilot.json each week.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_boards.py site/boards-ardupilot.json
      - name: Commit if changed
        run: |
          git config user.name "board-list-bot"
          git config user.email "board-list-bot@users.noreply.github.com"
          git add site/boards-ardupilot.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Refresh ArduPilot board list"
          git push
