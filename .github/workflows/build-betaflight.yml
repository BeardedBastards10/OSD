name: Build Betaflight with MGRS OSD
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Betaflight git tag to build (use the version you fly now)
        default: "2026.6.2"
      config:
        description: Betaflight board config name
        default: DAKEFPVH743

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check MGRS converter against a reference library
        continue-on-error: true
        run: |
          pip3 install mgrs
          gcc -O2 -Wall -Wextra -Werror -o mgrs_osd/test_mgrs mgrs_osd/test_mgrs.c -lm
          python3 mgrs_osd/compare.py

      - name: Get Betaflight source
        run: |
          git clone --depth 1 --branch "${{ inputs.tag }}" https://github.com/betaflight/betaflight.git bf
          git -C bf submodule update --init --depth 1 -- src/config

      - name: Patch OSD so MGRS replaces latitude/longitude
        run: python3 mgrs_osd/apply_betaflight.py bf

      - name: Install ARM toolchain
        working-directory: bf
        run: make arm_sdk_install

      - name: Build
        working-directory: bf
        run: |
          make configs
          make CONFIG="${{ inputs.config }}"

      - uses: actions/upload-artifact@v4
        with:
          name: betaflight-${{ inputs.config }}-mgrs
          path: bf/obj/*.hex
