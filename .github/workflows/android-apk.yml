name: Build Android APK

# Builds the Firmware Builder app (the site/ folder wrapped with Capacitor).
# Run it by hand (Actions, Run workflow), or push a tag like v1.0.0 to also publish a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and copy the site into www/
        run: |
          npm install
          npm run build

      - name: Generate the Android project and apply icons
        run: |
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          npx cap sync android

      - name: Use the permanent signing key (if the secret is set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using the permanent signing key"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: using a throwaway debug key (updates will not install over older builds)"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Firmware-Builder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Firmware-Builder-apk
          path: Firmware-Builder.apk

      - name: Publish release (tags like v1.0.0 only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Firmware-Builder.apk --title "Firmware Builder $GITHUB_REF_NAME" --notes "Android debug APK. Download Firmware-Builder.apk on your phone and allow 'install unknown apps' when asked. Needs internet."
